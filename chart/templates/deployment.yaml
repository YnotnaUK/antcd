apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-sa
      containers:
        - name: antcd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/antcd/config.yaml"]
          ports:
            - containerPort: {{ .Values.server.port }}
          {{- if or .Values.server.webhookSecret (include "antcd.hasGitTokens" .) }}
          env:
            {{- if .Values.server.webhookSecret }}
            - name: ANTCD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: webhook-secret
            {{- end }}
            {{- range $i, $repo := .Values.repos }}
            {{- if $repo.token }}
            - name: ANTCD_GIT_TOKEN_{{ $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-secrets
                  key: git-token-{{ $i }}
            {{- else if $repo.tokenSecret }}
            - name: ANTCD_GIT_TOKEN_{{ $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ $repo.tokenSecret.name }}
                  key: {{ $repo.tokenSecret.key }}
            {{- end }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.server.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.server.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/antcd
      volumes:
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-config
