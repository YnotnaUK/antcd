{{- if not .Values.repos }}
{{- fail "at least one entry in repos is required" }}
{{- end }}
{{- $repos := list }}
{{- range $i, $repo := .Values.repos }}
{{- $entry := omit $repo "token" "tokenSecret" }}
{{- if or $repo.token $repo.tokenSecret }}
{{- $entry = set $entry "tokenEnv" (printf "ANTCD_GIT_TOKEN_%d" $i) }}
{{- end }}
{{- $repos = append $repos $entry }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  config.yaml: |
    {{- dict "server" (dict "port" .Values.server.port) "repos" $repos | toYaml | nindent 4 }}
