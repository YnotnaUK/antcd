apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "basic.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ include "basic.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "basic.name" . }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
